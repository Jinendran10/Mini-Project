api:
  async_task_ttl: 1800
  celery_backend: redis://localhost:6379/1
  celery_broker: redis://localhost:6379/0
  host: 0.0.0.0
  max_samples_per_request: 1000
  port: 8000
  sync_timeout: 60
data:
  checkpoint_dir: /content/drive/MyDrive/mitigation_checkpoints
  embedding_cache_dir: ./cache/embeddings
  faiss_index_path: ./cache/faiss.index
  poisoned_data: ./data/poisoned_samples.json
  train_data: ./data/train.json
  val_data: ./data/val.json
logging:
  level: INFO
  log_file: ./logs/mitigation.log
model:
  dev_model: distilgpt2
  device: cpu
  gradient_checkpointing: true
  mixed_precision: true
  model_revision: null
  # Finetuned model - use the latest checkpoint from training
  target_model: ./jie_checkpoints-20260127T141832Z-3-001/jie_checkpoints/checkpoint-2000
jie:
  # Real trained checkpoints (4 checkpoints for TracIn)
  checkpoints:
    - ./jie_checkpoints-20260127T141832Z-3-001/jie_checkpoints/checkpoint-500
    - ./jie_checkpoints-20260127T141832Z-3-001/jie_checkpoints/checkpoint-1000
    - ./jie_checkpoints-20260127T141832Z-3-001/jie_checkpoints/checkpoint-1500
    - ./jie_checkpoints-20260127T141832Z-3-001/jie_checkpoints/checkpoint-2000
  
  device: cpu  # Use CPU for detection
  param_names:
    - lm_head
    - wte
  max_length: 512
  top_k_suspects: 100
rlod:
  # Use the BASE (pre-trained) model for embedding extraction — NOT the fine-tuned checkpoint.
  # Why: If the fine-tuned model is already poisoned, its embeddings are contaminated.
  # The base model has no knowledge of any injected trigger, so poisoned sentences
  # that were crafted to exploit the fine-tuned model appear anomalous in its representation space.
  model_name: gpt2-medium
  tokenizer_name: gpt2-medium
  device: cpu
  layer_index: -1  # Last layer embeddings
  k_neighbors: 5
  distance_threshold: 2.5
  embedding_cache_dir: ./cache/embeddings
  max_length: 512
  use_faiss_gpu: false  # Set to true if FAISS GPU is available
training:
  batch_size: 1
  gradient_accumulation_steps: 8
  jie:
    checkpoint_interval: 2
    influence_threshold: 0.8
    sample_rate: 0.3
  learning_rate: 5.0e-05
  max_seq_length: 512
  num_epochs: 10
  rlod:
    distance_threshold: 2.5
    embedding_layer: -1
    k_neighbors: 5
    use_faiss_gpu: false
  robust:
    max_weight: 1.0
    min_weight: 0.1
    weight_update_interval: 1
