# AI Data Poisoning Mitigation System Configuration

model:
  # Dev model for local prototyping (lightweight)
  dev_model: "distilgpt2"
  
  # Target model for Colab/GPU training (requires gradients & hidden states)
  target_model: "gpt2-medium"
  
  # Model commit hash for reproducibility (optional but recommended)
  # Get from: https://huggingface.co/gpt2-medium/commits/main
  model_revision: null  # e.g., "e7da7f221d5bf496a48136c0cd264e630fe9fcc8"
  
  # Device settings
  device: "cuda"  # "cuda" for GPU, "cpu" for local
  mixed_precision: true  # Use fp16 on GPU
  gradient_checkpointing: true  # Save memory during backprop

training:
  batch_size: 1
  max_seq_length: 512
  learning_rate: 5.0e-5
  num_epochs: 10
  gradient_accumulation_steps: 8  # Effective batch_size = 8
  
  # JIE (TracIn) settings
  jie:
    checkpoint_interval: 2  # Save checkpoint every N epochs
    sample_rate: 0.3  # Process 30% of samples for TracIn
    influence_threshold: 0.8  # Flag samples above this score
    
  # RLOD settings
  rlod:
    k_neighbors: 5  # kNN k value
    distance_threshold: 2.5  # Outlier distance threshold
    use_faiss_gpu: false  # Set true if faiss-gpu installed
    embedding_layer: -1  # -1 = last layer
    
  # Robust training settings
  robust:
    min_weight: 0.1  # Minimum sample weight (soft weighting)
    max_weight: 1.0  # Maximum sample weight
    weight_update_interval: 1  # Recompute weights every N epochs

data:
  # Dataset paths
  train_data: "./data/train.json"
  val_data: "./data/val.json"
  poisoned_data: "./data/poisoned_samples.json"  # For testing
  
  # Checkpointing
  checkpoint_dir: "./checkpoints"
  embedding_cache_dir: "./cache/embeddings"
  faiss_index_path: "./cache/faiss.index"

api:
  host: "0.0.0.0"
  port: 8000
  max_samples_per_request: 1000
  sync_timeout: 60  # seconds
  async_task_ttl: 1800  # seconds
  
  # Background worker
  celery_broker: "redis://localhost:6379/0"
  celery_backend: "redis://localhost:6379/1"

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_file: "./logs/mitigation.log"
