version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
  
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./results:/app/results
      - ./data:/app/data
    environment:
      - API_KEY=${API_KEY:-change_me_in_production}
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/1
      - LOG_LEVEL=INFO
      - RATE_LIMIT_PER_MINUTE=10
      - MAX_SAMPLES_PER_REQUEST=1000
      - SYNC_TIMEOUT=60
      - HF_HOME=/app/cache
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  
  worker:
    build: .
    command: celery -A src.api.tasks worker --loglevel=info --pool=solo --concurrency=1
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./results:/app/results
      - ./data:/app/data
    environment:
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/1
      - LOG_LEVEL=INFO
      - HF_HOME=/app/cache
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # GPU support (uncomment if using NVIDIA GPU)
